<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vincent Plessy — Terminal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Fira+Code:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div id="terminal-wrapper">
    <div id="title-bar">
      <div class="window-buttons">
        <span class="btn btn-close"></span>
        <span class="btn btn-minimize"></span>
        <span class="btn btn-maximize"></span>
      </div>
      <div class="title-text">bash — vincent@portfolio</div>
    </div>
    <div id="terminal">
      <div id="output"></div>
      <div id="input-line">
        <span class="prompt">$ </span><input id="cmd-input" type="text" autocomplete="off" spellcheck="false" autofocus>
      </div>
    </div>
  </div>
  <script src="assets/terminal.js"></script>
</body>
</html>
